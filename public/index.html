<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voxel Sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", sans-serif;
        background: #0b0f1a;
        color: #f6f8ff;
      }

      #hud {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 12px 16px;
        background: rgba(12, 16, 26, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        max-width: 320px;
        font-size: 14px;
        line-height: 1.4;
      }

      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 20px;
        height: 20px;
        margin-left: -10px;
        margin-top: -10px;
        pointer-events: none;
      }

      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.8);
      }

      #crosshair::before {
        width: 2px;
        height: 20px;
        left: 9px;
        top: 0;
      }

      #crosshair::after {
        width: 20px;
        height: 2px;
        left: 0;
        top: 9px;
      }

      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5, 8, 16, 0.85);
        text-align: center;
        cursor: pointer;
      }

      #overlay.hidden {
        display: none;
      }

      button {
        padding: 12px 18px;
        border-radius: 10px;
        border: none;
        background: #5c7cfa;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <strong>Voxel Sandbox</strong>
      <div>WASD — движение, пробел — прыжок, Shift — спринт.</div>
      <div>ЛКМ — удалить блок, ПКМ — поставить блок.</div>
      <div>Esc — освободить курсор.</div>
    </div>
    <div id="crosshair"></div>
    <div id="overlay">
      <div>
        <h1>Нажмите, чтобы начать</h1>
        <p>Мы используем Pointer Lock, чтобы управлять камерой.</p>
        <p id="overlay-message"></p>
        <button>Запустить игру</button>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
